<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>誰有時間看公報｜2026 議員選舉政見配對</title>
<meta name="description" content="公報十幾個人、幾百條政見，誰有時間看？回答幾題生活小麻煩，看看哪幾位候選人的政見跟你最合。">
<meta property="og:title" content="誰有時間看公報 🗳️">
<meta property="og:description" content="這些政見不告訴你是誰的，玩完才揭曉。新北第 1 ・ 8 ・ 9 選區・臺北第 5 ・ 6 選區">
<meta property="og:type" content="website">
<meta property="og:image" content="https://leeuniguana.github.io/bulletimeless/og.png">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--bg:#fff8ec;--ink:#2b2622;--sub:#7a6e64;--main:#e8613c;--main2:#ffd9a8;--card:#fff;--line:#eadfce;--ok:#2f9e6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}
main{max-width:520px;margin:0 auto;padding:20px 16px 64px;min-height:100vh}
h1{font-size:30px;margin:12px 0 4px;line-height:1.3}
h2{font-size:22px;margin:8px 0 6px;line-height:1.4}
p{margin:6px 0}
.sub{color:var(--sub);font-size:14px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:700;background:var(--main);color:#fff;margin-top:18px;cursor:pointer}
.btn:disabled{background:#d8cbbb;cursor:default}
.btn.ghost{background:transparent;color:var(--main);border:2px solid var(--main)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:15px;cursor:pointer;user-select:none}
.chip.soon{border-style:dashed;color:var(--sub);background:transparent;cursor:default}
.chip.on{border-color:var(--main);background:var(--main2);font-weight:700}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 14px}
.bar i{display:block;height:100%;background:var(--main);transition:width .3s}
.jar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0}
.jar .nm{flex:0 0 118px;font-size:15px}
.jar .meter{flex:1;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.jar .meter i{display:block;height:100%;background:#f2a541}
.jar .v{flex:0 0 40px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.jar button{flex:0 0 34px;height:34px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:18px;font-weight:700;cursor:pointer;color:var(--ink)}
.purse{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2;font-weight:700}
.event{background:var(--card);border-radius:18px;padding:18px;font-size:19px;font-weight:700;border:2px solid var(--line);margin:8px 0 14px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;font-size:16px;cursor:pointer;color:var(--ink)}
.opt:active,.opt.on{border-color:var(--main);background:var(--main2)}
.res{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}
.res.r1{border-color:var(--main)}
.rank{font-size:14px;color:var(--sub)}
.big{font-size:34px;font-weight:800;color:var(--main);line-height:1.2}
.who{font-size:20px;font-weight:800}
details{margin-top:8px}
summary{cursor:pointer;color:var(--main);font-weight:700}
ul{padding-left:20px;margin:6px 0}
li{margin:4px 0;font-size:14px}
.cardme{background:linear-gradient(135deg,#ffcf8a,#ff8f6b);border-radius:18px;padding:18px;color:#3a1d10;margin:14px 0}
.cardme .t{font-size:13px;opacity:.8}
.cardme .tags{font-size:20px;font-weight:800;margin:6px 0}
.vote{background:#2b2622;color:#fff;border-radius:18px;padding:18px;margin:14px 0}
.vote b{color:#ffd9a8}
.note{font-size:12px;color:var(--sub);margin-top:18px}
.hide{display:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b2622;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
.comp{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:6px 0 4px;background:var(--line)}
.comp i{display:block;height:100%}
.legend{font-size:12px;color:var(--sub)}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 3px 0 8px;vertical-align:-1px}
.warn{background:#fff3e0;border-left:4px solid #f2a541;padding:8px 10px;font-size:13px;border-radius:6px;margin:8px 0}
.cat{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:var(--line);margin-right:4px}
.cat.crit{background:#ffd6d6}
.close{background:#fff;border:2px dashed var(--main);border-radius:12px;padding:8px 12px;font-size:14px;margin:10px 0}
.res.mini{padding:12px}
.res.mini .big{font-size:24px}
.unr{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:14px 0}
.yn{display:flex;gap:10px}
.yn .btn{margin-top:8px}
.law{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.law .f{font-size:18px;font-weight:800;text-align:center;margin:10px 0 2px}
.jl{font-size:15px;margin:4px 0}
a{color:var(--main)}
</style>
</head>
<body>
<main id="app"><p class="sub">載入中…</p></main>
<div class="toast" id="toast"></div>

<script>
// 選區：data/districts.json 是目錄；網址加 ?d=a05 可以只顯示某個選區（貼到各地社團、分開看流量用）
const ONLY = new URLSearchParams(location.search).get('d');
let IDX;                     // 選區目錄
const rounds = () => D.rounds || 12;   // 一般事件題數（不含立場題、彩蛋題），寫在各選區 json
const MAX_TAGS = 5;
const STEP = 5;              // 硬幣每次加減 5 元

const $ = s => document.querySelector(s);
const app = $('#app');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1800); };

let D, S;   // D = 選區資料；S = 這一局的狀態（只存在玩家自己的瀏覽器裡，不會送出去）

const loadFail = e => { app.innerHTML = `<h2>😵 資料載入失敗</h2><p>${esc(e.message)}</p><p class="sub">如果你是直接雙擊打開 index.html，瀏覽器會擋住資料檔。請放上 GitHub Pages，或在資料夾裡執行 <code>python -m http.server</code> 再打開 http://localhost:8000</p>`; };
const getJSON = f => fetch(f).then(r => { if (!r.ok) throw new Error(`找不到 ${f}（HTTP ${r.status}）`); return r.json(); });

getJSON('data/districts.json')
  .then(x => { IDX = x; if (ONLY) IDX.districts = IDX.districts.filter(d => d.id === ONLY);
    if (!IDX.districts.length) throw new Error(`沒有這個選區：${ONLY}`);
    new Date() >= new Date(IDX.closeAt) && !location.search.includes('preview') ? closed() : home(); })
  .catch(loadFail);

function reset() { S = { area: null, tags: [], coins: {}, queue: [], qi: 0, shown: {}, picked: {}, log: [], hist: [], order: {} }; }

// ---------- 投票日之後 ----------
function closed() {
  app.innerHTML = `<h1>誰有時間看公報</h1><h2>🗳️ 投票時間到了</h2>
  <p>${IDX.voteDate.replace(/-/g, '/')} 是投票日，遊戲已經關閉。</p>
  <p>謝謝大家來玩！記得自己去看<a href="https://www.cec.gov.tw/" target="_blank" rel="noopener">中選會的選舉公報</a>。</p>`;
}

// ---------- 開場 ----------
function home() {
  reset();
  const cities = [...new Set(IDX.districts.map(d => d.city))];
  app.innerHTML = `
  <p class="sub">${IDX.title}</p>
  <h1>誰有時間看公報 🗳️</h1>
  <p>公報十幾個人、幾百條政見，說真的，誰有時間看？</p>
  <p>回答幾題生活小麻煩，翻開<b>不具名</b>的解方卡，<br>玩完才揭曉誰的政見跟你最合。</p>
  <p class="sub">⏱️ 大約 5 分鐘｜📵 你的答案不會離開這台手機</p>
  <h2 style="margin-top:22px">你住哪一區？</h2>
  <p class="sub">人在外地、戶籍在這裡的話，選戶籍所在的區</p>
  ${cities.map(c => `<p style="margin-top:14px"><b>${esc(c)}</b></p><div class="chips">${IDX.districts.filter(d => d.city === c).map(d =>
      d.areas.map(a => `<span class="chip" data-d="${d.id}" data-a="${esc(a)}">${esc(a)}</span>`).join('')).join('')}${(IDX.upcoming || []).filter(u => u.city === c).map(u => `<span class="chip soon">🚧 ${esc(u.name)}（製作中）</span>`).join('')}</div>`).join('')}
  ${IDX.upcomingNote && (IDX.upcoming || []).some(u => cities.includes(u.city)) ? `<p class="sub">ℹ️ ${esc(IDX.upcomingNote)}</p>` : ''}
  <p class="sub" id="dname"></p>
  <button class="btn" id="go" disabled>開始</button>`;
  let pickD = null;
  app.querySelectorAll('.chip:not(.soon)').forEach(c => c.onclick = () => {
    app.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
    c.classList.add('on'); S.area = c.dataset.a; pickD = c.dataset.d; $('#go').disabled = false;
    const d = IDX.districts.find(x => x.id === pickD);
    $('#dname').textContent = `→ ${d.city}議員${d.name}（${d.areas.map(a => a.replace('區', '')).join('・')}）`;
    const nt = (d.notes || {})[S.area]; if (nt) $('#dname').innerHTML = esc($('#dname').textContent) + `<br><span class="sub">ℹ️ ${esc(nt)}</span>`;
  });
  $('#go').onclick = () => {
    $('#go').disabled = true; $('#go').textContent = '載入中…';
    const area = S.area;
    getJSON(`data/district-${pickD}.json`).then(d => { D = d; S.area = area; D.intro ? introPage() : tagsPage(); }).catch(loadFail);
  };
}

// ---------- 同額競選說明（健檢模式的選區，點進來先看這頁；結算頁底部也有一份） ----------
const LAW_URL = 'https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=D0020010&flno=70';
function lawHTML() {
  return `<p>候選人數沒有超過應選名額時（同額競選），依《公職人員選舉罷免法》第 70 條，直轄市議員的得票數要達到門檻才算當選：</p>
  <div class="f">（選舉區選舉人總數 ÷ 應選名額）× 10%</div>
  <p class="sub" style="text-align:center"><small>例如：選舉區有 1,000 位選舉人、應選 1 席，門檻就是 1,000 ÷ 1 × 10% ＝ 100 票。</small></p>
  <p>沒有達到門檻的話，這一席視同缺額。同一選區缺額達到一半時，要在 3 個月內補選。</p>
  <p>也就是說，就算只有一位候選人，票數還是有意義。</p>
  <p class="sub">資料來源：<a href="${LAW_URL}" target="_blank" rel="noopener">全國法規資料庫《公職人員選舉罷免法》第 70 條</a></p>`;
}
function introPage() {
  app.innerHTML = `
  <div class="bar"><i style="width:5%"></i></div>
  <p class="sub">${esc(D.title)}</p>
  <h2>ℹ️ 只有一位候選人，還需要投票嗎？</h2>
  <div class="law">${lawHTML()}</div>
  <p>這一區只有一位候選人，沒辦法配對，所以改成<b>🩺 政見健檢</b>：先分配你的 100 元，再一張一張看公報上寫的政見，選「想要」或「不需要」，最後看看你在意的議題，公報涵蓋了幾成。</p>
  <button class="btn" id="go">開始健檢</button>
  <button class="btn ghost" id="home">回首頁</button>`;
  $('#go').onclick = tagsPage;
  $('#home').onclick = home;
  window.scrollTo(0, 0);
}

// ---------- 第 0 關：斜槓標籤 ----------
function tagsPage() {
  app.innerHTML = `
  <div class="bar"><i style="width:10%"></i></div>
  <h2>你是哪一種斜槓人生？</h2>
  <p class="sub">選出符合你的標籤，最多 ${MAX_TAGS} 個。可以同時是新手爸媽又是捷運受害者 😮‍💨</p>
  <div class="chips">${D.tags.map((t, i) => `<span class="chip${S.tags.includes(i) ? ' on' : ''}" data-i="${i}">${esc(t.name)}</span>`).join('')}</div>
  <p class="sub" id="cnt"></p>
  <button class="btn" id="go">下一步</button>`;
  const upd = () => { $('#cnt').textContent = `已選 ${S.tags.length} / ${MAX_TAGS}`; $('#go').disabled = !S.tags.length; };
  app.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    const i = +c.dataset.i, k = S.tags.indexOf(i);
    if (k >= 0) S.tags.splice(k, 1);
    else if (S.tags.length >= MAX_TAGS) return toast(`最多 ${MAX_TAGS} 個，斜槓太多會累 😵`);
    else S.tags.push(i);
    c.classList.toggle('on'); upd();
  });
  upd();
  $('#go').onclick = () => { S.coins = presetCoins(); coinsPage(); };
}

// 依標籤先分好硬幣：沒有保底，每個標籤替它的罐子加 4 份（兩個罐子就各 2 份），換算成 100 元、以 5 元為單位；沒選到的罐子從 0 開始
function presetCoins() {
  const w = {}; D.jars.forEach(j => w[j.k] = 0);
  S.tags.forEach(i => { const js = D.tags[i].jars; js.forEach(k => w[k] += 4 / js.length); });
  const sum = Object.values(w).reduce((a, b) => a + b, 0);
  const c = {}; D.jars.forEach(j => c[j.k] = Math.max(0, Math.round(w[j.k] / sum * 100 / STEP) * STEP));
  let diff = 100 - Object.values(c).reduce((a, b) => a + b, 0);
  while (diff !== 0) {   // 四捨五入後補差額，總數一定是 100
    const ks = Object.keys(c).sort((a, b) => c[b] - c[a]);
    const k = diff > 0 ? ks[0] : ks.find(k => c[k] > 0);
    c[k] += diff > 0 ? STEP : -STEP; diff += diff > 0 ? -STEP : STEP;
  }
  return c;
}

// ---------- 第 2 關：100 元預算 ----------
function coinsPage() {
  const left = () => 100 - Object.values(S.coins).reduce((a, b) => a + b, 0);
  const draw = () => {
    app.innerHTML = `
    <div class="bar"><i style="width:22%"></i></div>
    <h2>你有 100 元，要花在哪？</h2>
    <p>嗯…這是你嗎？不像的話把硬幣拖一拖 🪙</p>
    <div class="purse">💰 錢包剩 <span>${left()}</span> 元</div>
    ${D.jars.map(j => `<div class="jar"><span class="nm">${esc(j.name)}</span>
      <button data-k="${j.k}" data-d="-1" aria-label="減少">−</button>
      <span class="meter"><i style="width:${S.coins[j.k]}%"></i></span>
      <span class="v">${S.coins[j.k]}</span>
      <button data-k="${j.k}" data-d="1" aria-label="增加">＋</button></div>`).join('')}
    <p class="sub">每按一下 ${STEP} 元。想加某一罐，要先從別罐拿出來。</p>
    <button class="btn" id="go"${left() === 100 ? ' disabled' : ''}>就這樣，出題吧</button>
    <button class="btn ghost" id="back">回去改標籤</button>`;
    app.querySelectorAll('.jar button').forEach(b => b.onclick = () => {
      const k = b.dataset.k, d = +b.dataset.d * STEP;
      if (d > 0 && left() < STEP) return toast('錢包空了，先從別罐拿一點出來');
      if (d < 0 && S.coins[k] <= 0) return;
      S.coins[k] += d; draw();
    });
    $('#go').onclick = () => { if (left() > 0 && !confirm(`還有 ${left()} 元沒花，沒關係嗎？（不影響計分）`)) return; buildQueue(); question(); };
    $('#back').onclick = tagsPage;
  };
  draw();
}

// ---------- 出題：每個議題罐固定至少 1 題（不看硬幣），剩下的題目依硬幣比例抽 ----------
function buildQueue() {
  const byJar = {}; D.events.forEach(e => (byJar[e.jar] = byJar[e.jar] || []).push(e));
  const ks = D.jars.map(j => j.k).filter(k => byJar[k]);
  const n = {}; ks.forEach(k => n[k] = 1);
  let rest = rounds() - ks.length;
  while (rest > 0) {
    const pool = ks.filter(k => n[k] < byJar[k].length); if (!pool.length) break;
    const wt = k => (S.coins[k] || 0) + 0.001;   // 沒放硬幣的罐子幾乎不會多抽，但硬幣全滿時不會卡住
    let r = Math.random() * pool.reduce((a, k) => a + wt(k), 0);
    const k = pool.find(k => (r -= wt(k)) < 0) || pool[pool.length - 1];
    n[k]++; rest--;
  }
  let q = []; ks.forEach(k => q = q.concat(shuffle(byJar[k]).slice(0, n[k])));
  q = shuffle(q);
  (byJar.V || []).forEach(v => q.splice(Math.floor(Math.random() * (q.length + 1)), 0, v));   // 立場題每人必出
  const eggs = D.eggs || [];   // 沒有共通政見的選區（例如 f09）就不出彩蛋題
  if (eggs.length) {
    const egg = eggs[Math.floor(Math.random() * eggs.length)];
    q.push({ id: 'EGG', egg: true, text: egg.text, cards: [{ text: egg.card, cands: egg.cands, rows: egg.rows }] });
  }
  S.queue = q; S.qi = 0; S.shown = {}; S.picked = {}; S.log = []; S.hist = []; S.order = {};
}

// ---------- 第 1 關：生活事件 ----------
// chosen 一律是陣列：[] = 跳過；一般題 1 張；pick=2 的題目固定 2 張
function question() {
  const e = S.queue[S.qi];
  if (!e) return result();
  const total = S.queue.length, need = e.pick || 1;
  const cards = S.order[S.qi] || (S.order[S.qi] = e.egg ? e.cards : shuffle(e.cards));
  app.innerHTML = `
  <div class="bar"><i style="width:${30 + 65 * S.qi / total}%"></i></div>
  <p class="sub">第 ${S.qi + 1} / ${total} 題${e.jar === 'V' ? '｜🧭 立場題' : ''}${e.egg ? '｜🥚 彩蛋題（不計分）' : ''}</p>
  <div class="event">${esc(e.text)}</div>
  <p class="sub">${e.egg ? '這題只有一張卡…' : need > 1 ? `選項比較多，這題要<b>選 ${need} 個</b>你最想要的` : '你最想要哪一個解方？'}</p>
  ${cards.map((c, i) => `<button class="opt" data-i="${i}">${esc(c.text)}</button>`).join('')}
  ${need > 1 ? `<button class="btn" id="ok" disabled>選好了（0 / ${need}）</button>` : ''}
  ${e.egg ? '' : '<button class="btn ghost" id="skip">都不想要，跳過</button>'}
  <button class="btn ghost" id="prev">← ${S.qi ? '上一題' : '回去改硬幣'}</button>`;
  const redo = S.redo; S.redo = null;
  if (D.mode === 'checkup') return checkupQuestion(e, cards, total, redo);
  const opts = [...app.querySelectorAll('.opt')];
  if (redo && !redo.chosen.length && $('#skip')) $('#skip').textContent = '都不想要，跳過（你上次選這個）';
  $('#prev').onclick = goBack;
  const sk = $('#skip'); if (sk) sk.onclick = () => answer(e, cards, []);

  if (e.egg) {
    opts[0].onclick = () => {
      const c = cards[0];
      opts[0].outerHTML = `<div class="event" style="font-size:16px">😆 這題有 <b>${c.cands.length} 位候選人</b>都提過「${esc(c.text)}」，選誰都一樣！</div>`;
      app.insertAdjacentHTML('beforeend', '<button class="btn" id="go">看結果 🎁</button>');
      $('#go').onclick = () => { S.qi++; result(); };
      const pv = $('#prev'); if (pv) pv.remove();
    };
    return;
  }
  if (need === 1) {
    opts.forEach((b, i) => { if (redo && redo.chosen[0] === cards[i]) b.classList.add('on'); b.onclick = () => answer(e, cards, [cards[i]]); });
    return;
  }
  // 選 2 張：點一下選、再點一下取消；選滿 2 張才能按「選好了」
  let sel = redo ? redo.chosen.map(c => cards.indexOf(c)).filter(i => i >= 0) : [];
  const upd = () => {
    opts.forEach((b, i) => b.classList.toggle('on', sel.includes(i)));
    $('#ok').disabled = sel.length !== need; $('#ok').textContent = `選好了（${sel.length} / ${need}）`;
  };
  opts.forEach((b, i) => b.onclick = () => {
    const k = sel.indexOf(i);
    if (k >= 0) sel.splice(k, 1);
    else if (sel.length >= need) return toast(`這題選 ${need} 個就好，先取消一個`);
    else sel.push(i);
    upd();
  });
  $('#ok').onclick = () => answer(e, cards, sel.map(i => cards[i]));
  upd();
}

// 健檢模式：每題只有這位候選人的 1 張卡，選「想要」= 選中，「不需要」= 跳過（計分公式跟一般模式一樣）
function checkupQuestion(e, cards, total, redo) {
  app.innerHTML = `
  <div class="bar"><i style="width:${30 + 65 * S.qi / total}%"></i></div>
  <p class="sub">第 ${S.qi + 1} / ${total} 題｜🩺 政見健檢</p>
  <div class="event">${esc(e.text)}</div>
  <p class="sub">公報上寫的解方是這個，你需要嗎？</p>
  <div class="opt" style="cursor:default">${esc(cards[0].text)}</div>
  <div class="yn"><button class="btn${redo && redo.chosen.length ? '' : redo ? ' ghost' : ''}" id="yes">👍 想要</button>
  <button class="btn${redo && !redo.chosen.length ? '' : ' ghost'}" id="no">🙅 不需要</button></div>
  ${redo ? `<p class="sub">你上次選「${redo.chosen.length ? '想要' : '不需要'}」</p>` : ''}
  <button class="btn ghost" id="prev">← ${S.qi ? '上一題' : '回去改硬幣'}</button>`;
  $('#yes').onclick = () => answer(e, cards, [cards[0]]);
  $('#no').onclick = () => answer(e, cards, []);
  $('#prev').onclick = goBack;
}

function answer(e, cards, chosen) {
  cards.forEach(c => c.cands.forEach(n => S.shown[n] = (S.shown[n] || 0) + 1));
  chosen.forEach(c => { c.cands.forEach(n => S.picked[n] = (S.picked[n] || 0) + 1); S.log.push({ e, c }); });
  S.hist.push({ qi: S.qi, cards, chosen });
  S.qi++; question();
}

// 上一題：把上一題算進去的分數完整扣回來（選 2 張就扣 2 張），再回到那一題
function goBack() {
  const h = S.hist.pop();
  if (!h) { coinsPage(); return; }          // 第 1 題再往回 → 回硬幣頁（回來會重新出題）
  h.cards.forEach(c => c.cands.forEach(n => S.shown[n]--));
  h.chosen.forEach(c => { c.cands.forEach(n => S.picked[n]--); S.log.pop(); });
  S.qi = h.qi; S.redo = h; question();
}

// ---------- 計分（全部在這台裝置上算） ----------
function cosine(a, b) {
  let ab = 0, aa = 0, bb = 0;
  a.forEach((x, i) => { ab += x * b[i]; aa += x * x; bb += b[i] * b[i]; });
  return aa && bb ? ab / Math.sqrt(aa * bb) : 0;
}
function score() {
  const mine = D.jars.map(j => S.coins[j.k] || 0);
  return D.candidates.map(c => {
    const prof = D.profiles[c.no];
    const budget = cosine(mine, prof);                                                // 預算分：硬幣分配 vs 政見重心
    const card = ((S.picked[c.no] || 0) + 0.5) / ((S.shown[c.no] || 0) + 1);          // 卡片分：從 50% 起跳
    return { ...c, prof, budget, card, total: 0.5 * budget + 0.5 * card };
  }).sort((a, b) => b.total - a.total);
}

// ---------- 結算 ----------
// 公報成分（用條數算）：只有 showExtra 的選區才顯示
const COMP_ORDER = [['市政承諾','#2f9e6b'],['過去成績','#8cc9a8'],['立場題專用','#6aa3d8'],['共通彩蛋','#f2c46b'],['監督市府','#b9a07a'],['批評特定對象','#e35d5d'],['政治表態','#9a7fc0'],['口號理念自介','#c9bcae']];
function compHTML(no) {
  const c = (D.comp && D.comp[no]) || {}, n = Object.values(c).reduce((a, b) => a + b, 0);
  if (!n) return '';
  const rows = COMP_ORDER.filter(([k]) => c[k]);
  return `<p style="margin-bottom:0"><b>📋 公報成分</b>（共 ${n} 條，用條數算）</p>
    <div class="comp">${rows.map(([k, col]) => `<i style="width:${c[k] / n * 100}%;background:${col}"></i>`).join('')}</div>
    <div class="legend">${rows.map(([k, col]) => `<b style="background:${col}"></b>${k} ${Math.round(c[k] / n * 100)}%`).join('')}</div>`;
}
function extraHTML(no) {
  if (!D.showExtra) return '';
  const xs = (D.extra && D.extra[no]) || [];
  return `<details><summary>📄 公報裡還寫了什麼（不計分）</summary>
    <div class="warn">⚠️ 以下為候選人在選舉公報中自行刊登的內容，<b>原文照錄，未經本遊戲查證</b>，不代表本站立場，也不計入配對分數。內容涉及他人的部分，請自行查證。<a href="https://www.cec.gov.tw/" target="_blank" rel="noopener">中選會公報原文</a><br>
    部分候選人公報圖片解析度較低，文字經 OCR 辨識後已盡力核對，仍可能有用字誤差，一切以公報原文為準。</div>
    ${compHTML(no)}
    ${xs.length ? `<ul>${xs.map(x => `<li><span class="cat${x.cat === '批評特定對象' ? ' crit' : ''}">${esc(x.cat)}</span>${esc(x.t)}</li>`).join('')}</ul>` : '<p class="sub">除了計分的政見，公報上沒有其他內容。</p>'}
  </details>`;
}
function candHTML(c, r, mini) {
  const P = D.policies, pct = x => Math.round(x * 100) + '%';
  const mineCards = S.log.filter(x => x.c.cands.includes(c.no));
  const jarTop = D.jars.map((j, i) => [j.name, c.prof[i]]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const sum = c.prof.reduce((a, b) => a + b, 0);
  return `<div class="res${r === 0 ? ' r1' : ''}${mini ? ' mini' : ''}">
    <div class="rank">第 ${r + 1} 名</div>
    <div class="big">${pct(c.total)}</div>
    <div class="who">${c.no} 號 ${esc(c.name)}</div>
    <div class="sub">${esc(c.party === '無' ? '無黨籍' : c.party)}</div>
    <details><summary>這個分數怎麼來的？</summary>
      <p><b>預算分 ${pct(c.budget)}</b>（佔一半）：你的硬幣分配跟他的政見重心像不像。<br>
      他的政見重心：${jarTop.map(x => `${esc(x[0])} ${Math.round(x[1] / sum * 100)}%`).join('、')}</p>
      <p><b>卡片分 ${pct(c.card)}</b>（佔一半）：他的卡出現 ${S.shown[c.no] || 0} 次，你選了 ${S.picked[c.no] || 0} 次。</p>
      ${mineCards.length ? `<p>你選中的卡，對應公報原文：</p><ul>${mineCards.map(x => `<li>「${esc(x.c.text)}」<br><span class="sub">${x.c.rows.filter(i => P[i] && P[i].c === c.no).map(i => esc(P[i].t)).join('；')}</span></li>`).join('')}</ul>` : '<p class="sub">這次沒有選到他的卡。</p>'}
      ${D.ocrCands.includes(c.no) ? '<p class="sub">⚠️ 這位候選人的政見在公報上是圖片，以上文字經 OCR 摘要，以公報原文為準。</p>' : ''}
    </details>
    ${extraHTML(c.no)}</div>`;
}

// ---------- 健檢模式結算：不排名，顯示涵蓋率 ----------
function checkupResult() {
  const c = score()[0], pct = x => Math.round(x * 100) + '%', P = D.policies;
  const mine = D.jars.map((j, i) => ({ name: j.name, coin: S.coins[j.k] || 0, has: c.prof[i] > 0 }));
  const ok = mine.filter(j => j.coin > 0 && j.has).sort((a, b) => b.coin - a.coin);
  const miss = mine.filter(j => j.coin > 0 && !j.has).sort((a, b) => b.coin - a.coin);
  const extra = mine.filter(j => j.coin === 0 && j.has);
  const want = S.log.filter(x => x.c.cands.includes(c.no));
  const notWant = S.hist.filter(h => !h.chosen.length).map(h => h.cards[0]);
  const tagNames = S.tags.map(i => D.tags[i].name);
  const myTop = D.jars.map(j => [j.name, S.coins[j.k]]).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const weekend = tagNames.some(t => t.includes('週末才回家'));
  const li = x => `<li>「${esc(x.text)}」<br><span class="sub">${x.rows.filter(i => P[i]).map(i => esc(P[i].t)).join('；')}</span></li>`;

  app.innerHTML = `
  <div class="bar"><i style="width:100%"></i></div>
  <h2>🩺 政見健檢報告</h2>
  <p class="sub">${esc(D.title)}｜只比對公報上寫的內容，不代表候選人過去的實際表現，也不能取代你自己的判斷。</p>
  <div class="res r1">
    <div class="rank">你在意的議題，${D.id}-${c.no} ${esc(c.name)} 的公報涵蓋了幾成</div>
    <div class="big">${pct(c.total)}</div>
    <div class="sub">${esc(c.party === '無' ? '無黨籍' : c.party)}</div>
    ${ok.length ? `<p class="jl"><b>✅ 有寫到</b>：${ok.map(j => `${esc(j.name)}（你放 ${j.coin} 元）`).join('、')}</p>` : ''}
    ${miss.length ? `<p class="jl"><b>⚠️ 你在意但公報沒寫到</b>：${miss.map(j => `${esc(j.name)}（你放 ${j.coin} 元）`).join('、')}</p>` : '<p class="jl">👏 你放了硬幣的議題，公報上都有寫到。</p>'}
    ${extra.length ? `<p class="sub">公報上還寫了（你沒放硬幣）：${extra.map(j => esc(j.name)).join('、')}</p>` : ''}
    <details><summary>這個數字怎麼來的？</summary>
      <p><b>預算分 ${pct(c.budget)}</b>（佔一半）：你的硬幣分配跟公報的政見重心像不像。</p>
      <p><b>卡片分 ${pct(c.card)}</b>（佔一半）：一共 ${S.shown[c.no] || 0} 張卡，你選了 ${S.picked[c.no] || 0} 張「想要」。</p>
      <p class="sub">算法跟其他選區的契合度一樣，只是這一區只有一位候選人，所以不排名。</p>
      ${want.length ? `<p>👍 你想要的：</p><ul>${want.map(x => li(x.c)).join('')}</ul>` : ''}
      ${notWant.length ? `<p>🙅 你覺得不需要的：</p><ul>${notWant.map(li).join('')}</ul>` : ''}
    </details>
  </div>

  <div class="cardme">
    <div class="t">我的斜槓人生卡</div>
    <div class="tags">${tagNames.map(esc).join(' ／ ')}</div>
    <div>最在意：${myTop.map(x => `${esc(x[0])} ${x[1]} 元`).join('、')}</div>
    <div class="t" style="margin-top:6px">${esc(S.area || '')}｜誰有時間看公報</div>
  </div>

  <div class="vote">
    <div style="font-size:18px;font-weight:800">🗳️ 記得去投票</div>
    <p><b>${D.vote.date.slice(5).replace('-', '/')}（六）${D.vote.time}</b></p>
    <p>記得帶 ${esc(D.vote.bring)}</p>
    ${weekend ? '<p>🧳 週末才回家的人，這週記得回家喔！</p>' : ''}
  </div>
  <details class="law"><summary>ℹ️ 只有一位候選人，還需要投票嗎？</summary>${lawHTML()}</details>

  <button class="btn" id="share">分享給朋友</button>
  <button class="btn ghost" id="again">再玩一次</button>
  <p class="note">📵 你的作答和健檢結果只在這台裝置上計算，沒有送到任何地方。<br>
  計分規則和完整對照表都公開在 <a href="https://github.com/" id="repo" target="_blank" rel="noopener">GitHub</a>，歡迎檢查。<br>
  資料來源：${esc(D.source)}</p>`;
  bindResult();
}

function result() {
  if (D.mode === 'checkup') return checkupResult();
  const unr = D.unranked || [];
  const ranked = score().filter(c => !unr.includes(c.no));            // 不參加排名的人不進排名
  const nShow = ranked.length <= 4 ? ranked.length : (D.topN || 3);    // 4 人以下全列，5 人以上取前 topN
  const top = ranked.slice(0, nShow), rest = ranked.slice(nShow);
  const close = ranked.length >= 2 && ranked[0].total - ranked[1].total < 0.03;
  const tagNames = S.tags.map(i => D.tags[i].name);
  const myTop = D.jars.map(j => [j.name, S.coins[j.k]]).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const weekend = tagNames.some(t => t.includes('週末才回家'));
  const unrC = unr.map(no => D.candidates.find(c => c.no === no)).filter(Boolean);

  app.innerHTML = `
  <div class="bar"><i style="width:100%"></i></div>
  <h2>🎁 開盲盒！跟你最合的是…</h2>
  <p class="sub">${esc(D.title)}｜只比對公報上寫的內容，不代表候選人過去的實際表現，也不能取代你自己的判斷。</p>
  ${top.map((c, r) => candHTML(c, r, false)).join('')}
  ${close ? '<div class="close">🤏 前兩名分數很接近，建議兩位的政見都看看。</div>' : ''}
  ${rest.length ? `<button class="btn ghost" id="all">看全部候選人（還有 ${rest.length} 位）</button><div id="allbox" class="hide">${rest.map((c, i) => candHTML(c, nShow + i, true)).join('')}</div>` : ''}
  ${unrC.length ? `<div class="unr"><p>以下候選人公報上沒有可比對的市政承諾，因此不參加配對排名：${unrC.map(c => `${D.id}-${c.no} ${esc(c.name)}`).join('、')}（可點開查看公報內容）</p>
    ${unrC.map(c => `<div class="res mini"><div class="who">${c.no} 號 ${esc(c.name)}</div><div class="sub">${esc(c.party === '無' ? '無黨籍' : c.party)}</div>${extraHTML(c.no) || compHTML(c.no)}</div>`).join('')}</div>` : ''}

  <div class="cardme">
    <div class="t">我的斜槓人生卡</div>
    <div class="tags">${tagNames.map(esc).join(' ／ ')}</div>
    <div>最在意：${myTop.map(x => `${esc(x[0])} ${x[1]} 元`).join('、')}</div>
    <div class="t" style="margin-top:6px">${esc(S.area || '')}｜誰有時間看公報</div>
  </div>

  <div class="vote">
    <div style="font-size:18px;font-weight:800">🗳️ 記得去投票</div>
    <p><b>${D.vote.date.slice(5).replace('-', '/')}（六）${D.vote.time}</b></p>
    <p>記得帶 ${esc(D.vote.bring)}</p>
    ${weekend ? '<p>🧳 週末才回家的人，這週記得回家喔！</p>' : ''}
  </div>

  <button class="btn" id="share">分享給朋友</button>
  <button class="btn ghost" id="again">再玩一次</button>
  <p class="note">📵 你的作答和配對結果只在這台裝置上計算，沒有送到任何地方。<br>
  計分規則和完整對照表都公開在 <a href="https://github.com/" id="repo" target="_blank" rel="noopener">GitHub</a>，歡迎檢查。<br>
  資料來源：${esc(D.source)}</p>`;

  const allBtn = $('#all'); if (allBtn) allBtn.onclick = () => { $('#allbox').classList.remove('hide'); allBtn.remove(); };
  bindResult();
}
function bindResult() {
  $('#again').onclick = home;
  $('#share').onclick = async () => {
    const data = { title: '誰有時間看公報', text: '這些政見不告訴你是誰的，玩完才揭曉 🗳️', url: location.origin + location.pathname + '?d=' + D.id };
    try { if (navigator.share) await navigator.share(data); else { await navigator.clipboard.writeText(data.url); toast('網址已複製'); } } catch (_) {}
  };
  // 自動連到 repo：https://帳號.github.io/bulletimeless/ → https://github.com/帳號/bulletimeless
  const m = location.hostname.match(/^([^.]+)\.github\.io$/);
  if (m) $('#repo').href = `https://github.com/${m[1]}${location.pathname.replace(/\/[^/]*$/, '')}`;
  window.scrollTo(0, 0);
}
